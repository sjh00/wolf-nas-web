name: WolfNas Web Docker

on:
  workflow_dispatch:
  push:
    branches:
      - main
    tags:
      - v*

permissions:
  contents: write
  packages: write

jobs:
  ci:
    uses: ./.github/workflows/ci.yml

  build:
    runs-on: ubuntu-latest
    name: Build Docker Image
    needs: ci
    env:
      DOCKERHUB_USER: ${{ secrets.DOCKER_USERNAME }}
      DOCKERHUB_PWD: ${{ secrets.DOCKER_PASSWORD }}

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Install pnpm
        uses: pnpm/action-setup@v6
        with:
          run_install: false

      - name: Setup Node
        uses: ./.github/actions/setup-node

      # 前端在原生 runner 构建一次（多架构下避免 QEMU 仿真编译 node/rolldown 卡死）
      - name: Build Frontend (native)
        env:
          CI: true
          TURBO_CONCURRENCY: 2
        run: |
          pnpm install --frozen-lockfile
          pnpm run build:nexus

      - name: Set Up QEMU
        uses: docker/setup-qemu-action@v4

      - name: Set Up Buildx
        uses: docker/setup-buildx-action@v4

      - name: Login DockerHub
        if: ${{ env.DOCKERHUB_USER != '' && env.DOCKERHUB_PWD != '' }}
        uses: docker/login-action@v4
        with:
          username: ${{ env.DOCKERHUB_USER }}
          password: ${{ env.DOCKERHUB_PWD }}

      - name: Login GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set Tags
        id: tags
        run: |
          OWNER="${{ github.repository_owner }}"
          TAGS="ghcr.io/${OWNER}/wolf-nas-web:latest"
          if [[ "${GITHUB_REF}" == refs/tags/v* ]]; then
            VER="${GITHUB_REF_NAME#v}"
            TAGS="${TAGS},ghcr.io/${OWNER}/wolf-nas-web:${VER}"
          else
            VER="latest"
          fi
          echo "app_version=${VER}" >> "$GITHUB_ENV"
          if [ -n "${DOCKERHUB_USER}" ] && [ -n "${DOCKERHUB_PWD}" ]; then
            TAGS="${TAGS},${DOCKERHUB_USER}/wolf-nas-web:latest"
            if [[ "${GITHUB_REF}" == refs/tags/v* ]]; then
              TAGS="${TAGS},${DOCKERHUB_USER}/wolf-nas-web:${VER}"
            fi
          fi
          echo "tags=${TAGS}" >> "$GITHUB_OUTPUT"

      - name: Build and Push Image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ./scripts/deploy/Dockerfile.prod
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.tags.outputs.tags }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    needs: build
    name: Create Release
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Extract version and changelog
        id: extract
        run: |
          VERSION=${GITHUB_REF_NAME#v}
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "tag=$GITHUB_REF_NAME" >> $GITHUB_OUTPUT

          # 尝试从 CHANGELOG.md 提取版本内容
          CONTENT=$(awk '/^## v'"$VERSION"' /{flag=1;next}/^## v/{flag=0}flag' CHANGELOG.md 2>/dev/null || true)
          if [ -z "$CONTENT" ]; then
            CONTENT="WolfNas Web $GITHUB_REF_NAME 已发布。"
          fi

          {
            echo "notes<<CHANGELOG_EOF"
            echo "$CONTENT"
            echo "CHANGELOG_EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          name: WolfNas Web ${{ steps.extract.outputs.tag }}
          body: ${{ steps.extract.outputs.notes }}
          generate_release_notes: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Send Telegram Notification
        uses: appleboy/telegram-action@master
        with:
          to: ${{ secrets.TELEGRAM_CHAT_ID }}
          token: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          format: html
          message: |
            <b>WolfNas Web ${{ steps.extract.outputs.tag }} 已发布</b>

            <pre>${{ steps.extract.outputs.notes }}</pre>

            📦 Docker: <code>docker pull ghcr.io/sjh00/wolf-nas-web:latest</code>
            🔗 <a href="https://github.com/${{ github.repository }}/releases/tag/${{ steps.extract.outputs.tag }}">查看 Release</a>
